<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NoteDock</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div id="bgBackdrop" class="bg-backdrop"></div>

  <header class="app-header">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-mark">
        <path d="M4 4h16v12H7l-3 3V4z"></path>
      </svg>
      <span>NoteDock</span>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <nav class="tabs-row" id="tabsRow">
    <!-- note tabs injected here -->
  </nav>
  <button class="new-tab-btn" id="newTabBtn" title="Start a new note">+ New note</button>

  <section class="panel snippets-panel">
    <div class="panel-head">
      <h2>Quick copy</h2>
      <button class="icon-btn" id="toggleEditSnippets" title="Manage snippets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
      </button>
    </div>
    <div id="snippetsList" class="snippets-list"></div>
    <div id="addSnippetRow" class="add-snippet-row hidden">
      <input type="text" id="newSnippetLabel" placeholder="Label (e.g. Support line)" />
      <input type="text" id="newSnippetValue" placeholder="Value to copy" />
      <button id="addSnippetBtn" class="small-btn">Add</button>
    </div>
  </section>

  <section class="panel highlights-panel">
    <div class="panel-head">
      <h2>Saved from pages</h2>
    </div>
    <div id="highlightsList" class="highlights-list"></div>
  </section>

  <section class="panel notes-panel">
    <div class="panel-head">
      <h2>Notes</h2>
      <span id="saveIndicator" class="save-indicator"></span>
    </div>
    <textarea id="notesArea" placeholder="Notes for this one..."></textarea>
  </section>

  <div id="settingsModal" class="settings-modal hidden">
    <div class="settings-card">
      <div class="panel-head">
        <h2>Settings</h2>
        <button class="icon-btn" id="closeSettingsBtn" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="settings-section">
        <div class="settings-label">Theme</div>
        <div class="theme-choices" id="themeChoices">
          <button class="theme-btn" data-theme-choice="dark">Dark</button>
          <button class="theme-btn" data-theme-choice="light">Light</button>
          <button class="theme-btn" data-theme-choice="system">System</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Background image</div>
        <div class="bg-preview-row">
          <div id="bgPreview" class="bg-preview empty"></div>
          <div class="bg-preview-actions">
            <label class="small-btn file-btn" for="bgFileInput">Upload</label>
            <input type="file" id="bgFileInput" accept="image/*" class="hidden" />
            <button class="small-btn secondary-btn" id="removeBgBtn">Remove</button>
          </div>
        </div>
        <div id="bgStatus" class="bg-status"></div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
